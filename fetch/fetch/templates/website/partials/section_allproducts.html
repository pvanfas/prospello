{% load static %}
{% load filters %}
<section class="filters d-flex align-items-center">
    <form action="" method="get" class="w-100">
        <div class="container">
            <div class="row filter_bar align-items-center">
                <div class="col-12">
                    <div class="form-group category-filter-group">
                        {{products.form.category}}
                    </div>
                </div>
            </div>
        </div>
    </form>

</section>
<section id="products" class="products pt-0">
    <div class="container">
        <div class="row align-items-center">
            {% for product in products.qs %}
            <div class="col-md-3 col-sm-6 p-4 abs-margin">
                <div class="neuromorphic_card" onclick="location.href = '{{product.get_view_url}}';">
                    <div class="text-center">
                        <a href="{{product.get_view_url}}">
                            {% if product.featured_image %}
                            <img src="{{product.featured_image.url}}" loading="lazy" class="img-fluid img-abs" alt="Fetch office chairs Kerala" style="height:300px;object-fit: contain;" />
                            {% else %}
                            <img src="https://via.placeholder.com/250x350" class="img-fluid img-abs" alt="" style="height:300px;object-fit: contain;" />
                            {% endif %}
                        </a>
                    </div>
                    <div class="text-content h-100">
                        <strong class="mb-1 text-center">{{product.name}}</strong>
                    </div>
                    <a href="{{product.get_view_url}}" class="circ-btn"><i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
            {% empty %}
            <div class="text-center">
                <p>No Products Found</p>
            </div>
            {% endfor %}

        </div>
    </div>
</section>
