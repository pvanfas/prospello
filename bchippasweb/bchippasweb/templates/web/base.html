{% load static %}
<!DOCTYPE html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Bichippas Food Products | Authentic Kerala Flavours & Quality Packaged Foods</title>
    <meta name="title" content="Bichippas Food Products | Authentic Kerala Flavours & Quality Packaged Foods" />
    <meta name="description"
        content="Discover Bichippas, a trusted Kerala-based food brand offering high-quality packaged products. Explore our story, products, and delicious products." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bchippas.com/" />
    <meta property="og:title" content="Bichippas Food Products | Authentic Kerala Flavours & Quality Packaged Foods" />
    <meta property="og:description"
        content="Discover Bichippas, a trusted Kerala-based food brand offering high-quality packaged products. Explore our story, products, and delicious products." />
    <meta property="og:image" content="https://bchippas.com/static/web/images/meta-tags.png" />

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://bchippas.com/" />
    <meta property="twitter:title"
        content="Bichippas Food Products | Authentic Kerala Flavours & Quality Packaged Foods" />
    <meta property="twitter:description"
        content="Discover Bichippas, a trusted Kerala-based food brand offering high-quality packaged products. Explore our story, products, and delicious products." />
    <meta property="twitter:image" content="https://bchippas.com/static/web/images/meta-tags.png" />

    <!-- favicon icon -->
    <link rel="apple-touch-icon" sizes="57x57" href="{% static 'web/images/favicon/apple-icon-57x57.png' %}?v=1.0">
    <link rel="apple-touch-icon" sizes="60x60" href="{% static 'web/images/favicon/apple-icon-60x60.png' %}?v=1.0">
    <link rel="apple-touch-icon" sizes="72x72" href="{% static 'web/images/favicon/apple-icon-72x72.png' %}?v=1.0">
    <link rel="apple-touch-icon" sizes="76x76" href="{% static 'web/images/favicon/apple-icon-76x76.png' %}?v=1.0">
    <link rel="apple-touch-icon" sizes="114x114" href="{% static 'web/images/favicon/apple-icon-114x114.png' %}?v=1.0">
    <link rel="apple-touch-icon" sizes="120x120" href="{% static 'web/images/favicon/apple-icon-120x120.png' %}?v=1.0">
    <link rel="apple-touch-icon" sizes="144x144" href="{% static 'web/images/favicon/apple-icon-144x144.png' %}?v=1.0">
    <link rel="apple-touch-icon" sizes="152x152" href="{% static 'web/images/favicon/apple-icon-152x152.png' %}?v=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'web/images/favicon/apple-icon-180x180.png' %}?v=1.0">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'web/images/favicon/android-icon-192x192.png' %}?v=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'web/images/favicon/favicon-32x32.png' %}?v=1.0">
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'web/images/favicon/favicon-96x96.png' %}?v=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'web/images/favicon/favicon-16x16.png' %}?v=1.0">
    <link rel="manifest" href="{% static 'web/images/favicon/manifest.json' %}">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="{% static 'web/images/favicon/ms-icon-144x144.png' %}?v=1.0">
    <meta name="theme-color" content="#ffffff">

    <!-- google fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    
    <!-- style sheets and font icons  -->
    <link rel="stylesheet" href="{% static 'web/css/vendors.min.css' %}?v=1.0" />
    <link rel="stylesheet" href="{% static 'web/css/icon.min.css' %}?v=1.0" />
    <link rel="stylesheet" href="{% static 'web/css/style.min.css' %}?v=1.0" />
    <link rel="stylesheet" href="{% static 'web/css/responsive.min.css' %}?v=1.0" />
    <link rel="stylesheet" href="{% static 'web/css/main.css' %}?v=1.0" />
</head>

<body data-mobile-nav-trigger-alignment="right" data-mobile-nav-style="modern" data-mobile-nav-bg-color="#27480D"
    class="custom-cursor">
    <!-- start cursor -->
    <div class="cursor-page-inner">
        <div class="circle-cursor circle-cursor-inner"></div>
        <div class="circle-cursor circle-cursor-outer"></div>
    </div>
    <!-- end cursor -->
    {% block header %}
    {% include 'web/partials/header.html' %}
    {% endblock %}

    {% block content %}

    {% endblock %}

    {% block footer %}
    {% include 'web/partials/footer.html' %}
    {% endblock %}

    <!-- start scroll progress -->
    <div class="scroll-progress d-none d-xxl-block">
        <a href="#" class="scroll-top" aria-label="scroll">
            <span class="scroll-text">Scroll</span><span class="scroll-line"><span class="scroll-point"></span></span>
        </a>
    </div>
    <!-- end scroll progress -->
    <!-- javascript libraries -->
    <script type="text/javascript" src="{% static 'web/js/jquery.js' %}?v=1.0"></script>
    <script type="text/javascript" src="{% static 'web/js/vendors.min.js' %}?v=1.0"></script>
    <script type="text/javascript" src="{% static 'web/js/main.js' %}?v=1.0"></script>
</body>

</html>
