{% load static %}{% load filters %}
{% if testimonials %}
<section id="testimonials" class="testimonials" style="background: url({% static 'web/images/testimonial_bg.svg' %}) no-repeat left bottom; background-size: cover;">
    <div class="container">
        <div class="content text-center pb-2">
            <h3>TESTIMONIALS</h3>
            <span class="pattern mx-auto"></span>
        </div>

        <div class="testimonials-slider swiper">
            <div class="swiper-wrapper">
                {% for testimonial in testimonials %}
                <div class="swiper-slide">
                    <div class="testimonial-card">
                        <div class="quote-icon">
                            <i class="bi bi-quote"></i>
                        </div>
                        <div class="rating-stars">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                        </div>
                        <p class="testimonial-text">
                            "{{testimonial.content}}"
                        </p>
                        <div class="testimonial-profile">
                            <div class="profile-avatar">
                                <img src="{{testimonial.photo.crop.200x200}}" alt="{{testimonial.name}}" />
                            </div>
                            <div class="profile-info">
                                <h4 class="profile-name">{{testimonial.name}}</h4>
                                <span class="profile-title">Verified Customer</span>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div class="testimonials-pagination swiper-pagination"></div>
        </div>
    </div>
</section>
{% endif %}
